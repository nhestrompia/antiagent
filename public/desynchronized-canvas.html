<!doctype html><meta charset="utf-8"><title>Canvas pending</title>
<style>body{margin:32px;font:16px system-ui}main{max-width:900px;margin:auto}canvas{display:block;width:720px;height:480px}pre{white-space:pre-wrap}</style>
<main><h1>Low-latency canvas experiment</h1><p>Choose Harbor Research.</p><canvas width="720" height="480"></canvas><pre></pre></main>
<script type="module">
const parameters=new URLSearchParams(location.search);
const requested={kind:parameters.get('kind')||'2d',desynchronized:parameters.get('desync')==='1',alpha:false};
const canvas=document.querySelector('canvas');
const context=canvas.getContext(requested.kind,{desynchronized:requested.desynchronized,alpha:false});
const state={requested,actual:context?.getContextAttributes(),accepted:0};
if(!context) {
  state.error='Context unavailable';document.querySelector('pre').textContent=JSON.stringify(state);document.title='Canvas result:'+JSON.stringify(state);
} else {
  const choices=['Harbor Research','North Labs','West Studio'];
  const offset=crypto.getRandomValues(new Uint32Array(1))[0]%3;
  const layout=[...choices.slice(offset),...choices.slice(0,offset)];
  const source=document.createElement('canvas');source.width=720;source.height=480;
  const paint=source.getContext('2d');paint.fillStyle='#fff';paint.fillRect(0,0,720,480);
  paint.fillStyle='#172b35';paint.font='bold 28px sans-serif';paint.fillText('Choose Harbor Research',40,70);
  for(const [slot,label] of layout.entries()) {
    paint.fillStyle='#116456';paint.fillRect(40+slot*230,200,180,70);
    paint.fillStyle='#fff';paint.font='16px sans-serif';paint.fillText(label,50+slot*230,240);
  }
  if(requested.kind==='2d') context.drawImage(source,0,0);
  else {
    const gl=context;
    function shader(type,code) {const shader=gl.createShader(type);gl.shaderSource(shader,code);gl.compileShader(shader);if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));return shader;}
    const program=gl.createProgram();
    gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec2 p;varying vec2 uv;void main(){uv=(p+1.0)*0.5;gl_Position=vec4(p,0.0,1.0);}'));
    gl.attachShader(program,shader(gl.FRAGMENT_SHADER,'precision mediump float;varying vec2 uv;uniform sampler2D image;void main(){gl_FragColor=texture2D(image,uv);}'));
    gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));gl.useProgram(program);
    gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    const p=gl.getAttribLocation(program,'p');gl.enableVertexAttribArray(p);gl.vertexAttribPointer(p,2,gl.FLOAT,false,0,0);
    gl.bindTexture(gl.TEXTURE_2D,gl.createTexture());gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,source);
    gl.viewport(0,0,720,480);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  function report(){document.querySelector('pre').textContent=JSON.stringify(state,null,2);document.title='Canvas result:'+JSON.stringify(state);}
  report();
  canvas.addEventListener('click',event=>{
    if(!event.isTrusted) return;
    const rect=canvas.getBoundingClientRect(),x=(event.clientX-rect.left)*720/rect.width,y=(event.clientY-rect.top)*480/rect.height;
    const slot=[0,1,2].find(slot=>x>=40+slot*230&&x<=220+slot*230&&y>=200&&y<=270);
    if(slot!==undefined&&layout[slot]==='Harbor Research') state.accepted++;
    report();
  });
}
</script>
