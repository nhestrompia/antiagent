<!doctype html><meta charset="utf-8"><title>pending</title>
<h1>Runtime stack cost experiment</h1><pre></pre>
<script>
Error.stackTraceLimit = 0;
let sink;
function create(depth, throwing) {
  if (depth) { create(depth - 1, throwing); return; }
  if (throwing) { try { throw new Error('probe'); } catch (error) { sink = error; } }
  else sink = new Error('probe');
}
function median(values) { return [...values].sort((a,b) => a-b)[Math.floor(values.length/2)]; }
setTimeout(async () => {
  const measurements = [];
  for (const throwing of [false, true]) for (const depth of [0, 20, 80]) {
    for (let i=0;i<500;i++) create(depth, throwing);
    const samples=[];
    for (let round=0;round<9;round++) {
      const start=performance.now();
      for (let i=0;i<2000;i++) create(depth, throwing);
      samples.push(performance.now()-start);
      await new Promise(resolve=>setTimeout(resolve,0));
    }
    measurements.push({throwing,depth,medianMs:median(samples),samples});
  }
  document.querySelector('pre').textContent=JSON.stringify(measurements,null,2);
  document.title='result:'+JSON.stringify(measurements);
},200);
</script>
