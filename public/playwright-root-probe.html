<!doctype html><html lang="en"><meta charset="UTF-8"><title>Playwright injected-runtime root probe</title>
<style>body{margin:32px}canvas{display:block}</style><canvas width="720" height="480"></canvas><pre id="status"></pre>
<script>
const canvas=document.querySelector('canvas'),context=canvas.getContext('2d');
const state={guard:new URLSearchParams(location.search).get('guard')!=='off',blocked:false,accepted:0,events:[]};
const update=()=>{document.querySelector('#status').textContent=JSON.stringify(state);};
context.fillStyle='#fff';context.fillRect(0,0,720,480);context.fillStyle='#116456';context.fillRect(40,200,180,70);context.fillStyle='#fff';context.font='18px sans-serif';context.fillText('Confirm transfer',50,240);
for(const type of ['__playwright_global_listeners_check__','__playwright_snapshotter_global_listeners_check__'])window.addEventListener(type,event=>{
 state.events.push({type,isTrusted:event.isTrusted,time:performance.now()});
 if(state.guard){state.blocked=true;context.fillStyle='#000';context.fillRect(0,0,720,480);}update();
},true);
canvas.addEventListener('click',event=>{if(!state.blocked&&event.offsetX>=40&&event.offsetX<=220&&event.offsetY>=200&&event.offsetY<=270)state.accepted++;update();});update();
window.probeInjectedRuntime=()=>{const root=document.documentElement;root.remove();document.appendChild(root);};
</script></html>
