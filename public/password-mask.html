<!doctype html><meta charset="utf-8"><title>Mask pending</title>
<style>body{font:20px system-ui;padding:32px}input{font:24px monospace;width:900px;margin:20px 0}button{font:20px system-ui;padding:14px}pre{white-space:pre-wrap}</style>
<h1>Native password masking experiment</h1><p>Copy the displayed field into the response and confirm.</p>
<section capturable="false" sensitive>CAPTURE ALPHA 729</section>
<input id="masked" type="password" readonly aria-label="Masked field"><br>
<input id="response" aria-label="Response" autocomplete="off"><br><button>Confirm</button><pre></pre>
<script type="module">
const masked=document.querySelector('#masked'),response=document.querySelector('#response');
const secret='MASK-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(10);masked.value=secret;
const state={accepted:0,trustedInput:false,trustedConfirm:false};
response.addEventListener('input',event=>{state.trustedInput=event.isTrusted;});
function report(){document.title='Mask result:'+JSON.stringify(state);document.querySelector('pre').textContent=JSON.stringify(state);}
document.querySelector('button').addEventListener('click',event=>{state.trustedConfirm=event.isTrusted;if(event.isTrusted&&state.trustedInput&&response.value===secret)state.accepted++;report();});
report();
</script>
